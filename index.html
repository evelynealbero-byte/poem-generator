<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel=" stylesheet" href="src/style.css" />
    <title>AI Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Spanish Poem Generator</h1>
      </header>
      <main>
        <form>
          <input
            type="text"
            placeholder="Enter the topic of the Spanish poem"
            autofocus
            required
            autocomplete="off"
            class="instructions"
          />
          <input type="submit" class="submit-button" />
        </form>
        <div class="poem">
          En las noches claras,
          <br />
          Invito a la luna y con mi sombra somos tres.
        </div>
      </main>
    </div>
    <footer>
      This was coded by
      <a href="https://github.com/evelynealbero-byte" target="_blank"
        >Evelyne Albero</a
      >
      and is
      <a
        href="https://github.com/evelynealbero-byte/poem-generator"
        target="_blank"
        >open-sourced on GitHub</a
      >
    </footer>
    <script src=" src/index.js"></script>
  </body>
</html>
